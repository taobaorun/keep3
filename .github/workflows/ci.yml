name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve pinned packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project Keep3.xcodeproj
          -scheme Keep3
          -derivedDataPath .build/DerivedData

      - name: Run native unit tests
        run: >-
          xcodebuild test
          -project Keep3.xcodeproj
          -scheme Keep3
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath .build/DerivedData
          -only-testing:Keep3Tests
          CODE_SIGNING_ALLOWED=NO

      - name: Verify updater fixtures
        run: scripts/tests/sparkle-integration-tests.sh

      - name: Verify canonical release contract and packaging dry run
        run: scripts/tests/release-contract-tests.sh

      - name: Verify staged channel state machine
        run: scripts/tests/channel-promotion-tests.sh

      - name: Analyze native targets
        run: >-
          xcodebuild analyze
          -project Keep3.xcodeproj
          -scheme Keep3
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath .build/DerivedData
          CODE_SIGNING_ALLOWED=NO
